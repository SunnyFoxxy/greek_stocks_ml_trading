[project]
name = "greek-stocks-ml-trading"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SunnyFoxxy", email = "119753950+SunnyFoxxy@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
    "yfinance>=1.8.0",
]

[project.scripts]
greek-stocks-ml-trading = "greek_stocks_ml_trading:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
